<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Till Ready</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone column; each voucher is a torn till-receipt slip on a cool counter-top grey, opening to a white "show at till" panel */
:root{
  --bg:#e5eaed; --slip:#ffffff; --ink:#16212a; --muted:#56656e; --line:#d0d9de;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#d7eee8;
  --warn:#8f5300; --warn-bg:#fcefd4; --bad:#ad3329; --bad-bg:#fbe3df;
  --till-bg:#ffffff; --till-ink:#000000; --shade:rgba(14,22,28,.5); --shadow:rgba(20,34,44,.18);
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161a; --slip:#1b242a; --ink:#e4ecef; --muted:#93a4ad; --line:#2d3a42;
  --accent:#55c3b2; --accent-ink:#04211c; --accent-soft:#163b35;
  --warn:#f2b95c; --warn-bg:#3a2a0f; --bad:#f28c80; --bad-bg:#3f1d19;
  --till-bg:#ffffff; --till-ink:#000000; --shade:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161a; --slip:#1b242a; --ink:#e4ecef; --muted:#93a4ad; --line:#2d3a42;
  --accent:#55c3b2; --accent-ink:#04211c; --accent-soft:#163b35;
  --warn:#f2b95c; --warn-bg:#3a2a0f; --bad:#f28c80; --bad-bg:#3f1d19;
  --till-bg:#ffffff; --till-ink:#000000; --shade:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.top h1{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top h1 span{color:var(--accent)}
.top p{margin:6px 0 0;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--slip);font-weight:700;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn.danger{color:var(--bad);background:transparent;border-color:transparent}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .primary{grid-column:1/-1;min-height:58px;font-size:1.08rem}

.summary{margin:0;font-weight:700}
.summary .w{color:var(--warn)}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 4px;margin-right:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.8rem;font-weight:600;margin-left:4px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:14px}
.slip-wrap{filter:drop-shadow(0 1px 1.5px var(--shadow));border-radius:4px}
.slip-wrap:has(.slip:focus-visible){outline:3px solid var(--accent);outline-offset:3px}
.slip{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--slip);padding:16px 16px 26px;border-radius:4px 4px 0 0;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;outline:none}
.slip.dim{opacity:.72}
.slip-head{display:flex;align-items:center;gap:10px;min-width:0}
.badge{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:.95rem;flex:none;letter-spacing:.02em}
.shop{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.used{background:transparent;color:var(--muted);border:1px solid var(--line)}
.offer{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.32rem;line-height:1.15;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.mini{background:var(--till-bg);border-radius:4px;padding:6px 10px;height:46px;display:flex;align-items:center}
.mini svg{width:100%;height:34px;display:block}
.receipt-line{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.stamp{position:absolute;right:18px;top:52px;transform:rotate(-8deg);font-family:var(--f-mono);font-weight:600;font-size:.9rem;letter-spacing:.18em;color:var(--bad);border:2px solid currentColor;padding:2px 8px;border-radius:4px;opacity:.85;pointer-events:none}
.slip-wrap{position:relative}

.empty{background:var(--slip);border:1px dashed var(--line);border-radius:10px;padding:22px 18px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.foot{color:var(--muted);font-size:.85rem;margin:6px 0 0}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:560px;margin:0 auto;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;position:sticky;top:0;background:var(--bg);z-index:2}
.bar strong{font-family:var(--f-display);font-stretch:85%;font-size:1.15rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.till{background:var(--till-bg);color:var(--till-ink);border-radius:8px;padding:26px 22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line)}
.till-code{width:100%;display:flex;justify-content:center}
.till-code svg{width:100%;height:150px;display:block}
.till-code.qr svg{width:min(240px,100%);height:auto;aspect-ratio:1}
.digits{font-family:var(--f-mono);font-size:1.15rem;letter-spacing:.14em;font-weight:600;overflow-wrap:anywhere;text-align:center;color:var(--till-ink)}
.till .fmt{font-size:.75rem;color:#555;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.banner{border-radius:10px;padding:12px 14px;font-weight:700;background:var(--bad-bg);color:var(--bad)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.d-offer{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.6rem;line-height:1.12;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.facts dt{color:var(--muted);font-size:.9rem}
.facts dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-btns .primary{grid-column:1/-1}
details{background:var(--slip);border-radius:10px;border:1px solid var(--line)}
summary{padding:12px 14px;cursor:pointer;font-weight:700}
details img{display:block;width:100%;border-radius:0 0 10px 10px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700}
.confirm .btn{min-height:38px}

/* Editor */
.photo-zone{display:flex;flex-direction:column;gap:10px}
.photo-zone img{border-radius:8px;max-height:220px;object-fit:contain;background:var(--slip);border:1px solid var(--line);width:100%}
.status{border-radius:10px;padding:10px 12px;background:var(--slip);border:1px solid var(--line);font-size:.95rem}
.status.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.status.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:700}
.photo-btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field .sub{color:var(--muted);font-size:.82rem;font-weight:400}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--slip)}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--accent);outline-offset:0;border-color:transparent}
.field input.mono{font-family:var(--f-mono);letter-spacing:.06em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.prev .till-code svg{height:96px}
.prev .till-code.qr svg{width:min(170px,100%)}
.prev-empty{color:#666;font-size:.9rem;padding:20px 0}
.err{color:var(--bad);font-weight:700;margin:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;vertical-align:-3px;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:360px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<div class="app">
  <header class="top">
    <h1>Till <span>Ready</span></h1>
    <p>Snap your money-off vouchers when you get them. Show the barcode at the checkout.</p>
  </header>

  <section class="actions" aria-label="Add a voucher">
    <label class="btn primary" for="cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
      Scan a voucher
    </label>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <label class="btn" for="pick">Choose a photo</label>
    <input type="file" id="pick" accept="image/*" hidden>
    <button class="btn ghost" id="manualBtn" type="button">Type the number</button>
  </section>

  <p class="summary" id="summary" aria-live="polite">Loading your vouchers…</p>

  <nav class="tabs" role="tablist" aria-label="Voucher lists">
    <button class="tab" role="tab" id="tabLive" aria-selected="true" type="button">Ready to use<span class="n" id="nLive"></span></button>
    <button class="tab" role="tab" id="tabOld" aria-selected="false" type="button">Used &amp; expired<span class="n" id="nOld"></span></button>
  </nav>

  <div class="list" id="list" role="tabpanel"></div>
  <p class="foot" id="storeNote"></p>
</div>

<!-- Show at till -->
<div class="overlay" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="dShop">
  <div class="sheet">
    <div class="bar">
      <button class="btn small" id="dClose" type="button">Back</button>
      <strong id="dShop"></strong>
      <span style="width:62px"></span>
    </div>
    <div class="banner" id="dWarn" hidden></div>
    <div class="till">
      <div class="till-code" id="dCode"></div>
      <div class="digits" id="dDigits"></div>
      <div class="fmt" id="dFmt"></div>
    </div>
    <p class="hint">Turn your screen brightness up and hold the phone flat, about a hand's width from the scanner.</p>
    <h2 class="d-offer" id="dOffer"></h2>
    <dl class="facts" id="dFacts"></dl>
    <div class="row-btns">
      <button class="btn primary" id="dUsed" type="button">Mark as used</button>
      <button class="btn" id="dEdit" type="button">Edit details</button>
      <button class="btn" id="dCopy" type="button">Copy number</button>
    </div>
    <details id="dPhotoWrap"><summary>Original photo</summary><img id="dPhoto" alt="Photo of the original voucher"></details>
    <div>
      <button class="btn danger" id="dDel" type="button">Delete voucher</button>
      <div class="confirm" id="dDelConfirm" hidden>
        <span>Delete this voucher for good?</span>
        <button class="btn small" id="dDelYes" type="button" style="background:var(--bad);color:var(--slip);border-color:var(--bad)">Delete</button>
        <button class="btn small" id="dDelNo" type="button">Keep it</button>
      </div>
    </div>
  </div>
</div>

<!-- Add / edit -->
<div class="overlay" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="eTitle">
  <form class="sheet" id="form" novalidate>
    <div class="bar">
      <button class="btn small" id="eClose" type="button">Cancel</button>
      <strong id="eTitle">New voucher</strong>
      <button class="btn small primary" type="submit">Save</button>
    </div>

    <div class="photo-zone" id="photoZone">
      <img id="ePhoto" alt="Your voucher photo" hidden>
      <div class="status" id="eStatus" hidden></div>
      <div class="photo-btns">
        <label class="btn small" for="cam2" id="retakeLbl">Take a photo</label>
        <input type="file" id="cam2" accept="image/*" capture="environment" hidden>
        <button class="btn small" id="eAsk" type="button" hidden>Fill in details from the photo</button>
      </div>
    </div>

    <div class="till prev" aria-label="Barcode preview">
      <div class="till-code" id="ePrev"></div>
      <div class="digits" id="ePrevDigits"></div>
      <div class="fmt" id="ePrevFmt"></div>
    </div>

    <div class="field">
      <label for="fCode">Barcode number <span class="sub">· the digits printed under the bars</span></label>
      <input id="fCode" class="mono" inputmode="text" autocomplete="off" spellcheck="false" placeholder="e.g. 1234567890128">
    </div>
    <div class="field">
      <label for="fFormat">Barcode type</label>
      <select id="fFormat">
        <option value="CODE128">Code 128 (most till coupons)</option>
        <option value="EAN13">EAN-13</option>
        <option value="EAN8">EAN-8</option>
        <option value="UPC">UPC-A</option>
        <option value="ITF">ITF (interleaved 2 of 5)</option>
        <option value="CODE39">Code 39</option>
        <option value="QR">QR code</option>
      </select>
    </div>
    <div class="two">
      <div class="field">
        <label for="fShop">Shop</label>
        <input id="fShop" list="shops" autocomplete="off" placeholder="Morrisons">
        <datalist id="shops"></datalist>
      </div>
      <div class="field">
        <label for="fExp">Valid until</label>
        <input id="fExp" type="date">
      </div>
    </div>
    <div class="field">
      <label for="fOffer">Offer</label>
      <input id="fOffer" autocomplete="off" placeholder="e.g. £5 off when you spend £40">
    </div>
    <div class="field">
      <label for="fCard">Loyalty card ending <span class="sub">· optional, if the voucher is tied to a card</span></label>
      <input id="fCard" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="e.g. 1234">
    </div>
    <div class="field">
      <label for="fNotes">Conditions or notes <span class="sub">· optional</span></label>
      <textarea id="fNotes" rows="2" placeholder="e.g. In-store only, excludes petrol"></textarea>
    </div>
    <p class="err" id="eErr" hidden></p>
    <button class="btn primary" type="submit" style="min-height:54px">Save voucher</button>
  </form>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const SHOPS = ["Morrisons","Tesco","Sainsbury's","Asda","Aldi","Lidl","Co-op","Waitrose","M&S","Iceland","Boots","Superdrug","Home Bargains","B&M"];
$('shops').innerHTML = SHOPS.map(s=>`<option value="${esc(s)}">`).join('');
const FORMAT_NAMES = {CODE128:"Code 128",EAN13:"EAN-13",EAN8:"EAN-8",UPC:"UPC-A",ITF:"ITF",CODE39:"Code 39",QR:"QR code"};
const LOCAL_KEY = 'tillready.v1';

let vouchers = [], mode = 'loading', col = null, sample = null, tab = 'live';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){try{return crypto.randomUUID()}catch(e){return 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ---------- dates ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysLeft(iso){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);const [ty,tm,td]=todayISO().split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(ty,tm-1,td))/864e5)}
function ukShort(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}/${m}/${y.slice(2)}`}
function ukLong(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function status(v){
  if(v.used) return {key:'used',label:'Used',cls:'used',old:true};
  const n=daysLeft(v.expires);
  if(n===null) return {key:'live',label:'No expiry',cls:'',old:false};
  if(n<0) return {key:'expired',label:'Expired',cls:'bad',old:true};
  if(n===0) return {key:'soon',label:'Expires today',cls:'warn',old:false};
  if(n<=3) return {key:'soon',label:n===1?'1 day left':n+' days left',cls:'warn',old:false};
  return {key:'live',label:n+' days left',cls:'',old:false};
}

/* ---------- barcode rendering ---------- */
function renderCode(el, code, format){
  el.innerHTML=''; el.classList.remove('qr');
  code=(code||'').trim();
  if(!code) return {ok:false,msg:''};
  if(format==='QR'){
    try{const q=qrcode(0,'M');q.addData(code);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});el.classList.add('qr');
      const s=el.querySelector('svg'); s.querySelectorAll('rect,path').forEach(n=>{if(n.getAttribute('fill')==='white'||n.getAttribute('fill')==='#ffffff')n.setAttribute('fill','#ffffff')});
      return {ok:true}}catch(e){return {ok:false,msg:'Too long for a QR code.'}}
  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  try{
    let valid=true;
    JsBarcode(svg,code,{format,displayValue:false,margin:0,width:2,height:100,background:'#ffffff',lineColor:'#000000',valid:v=>{valid=v}});
    if(!valid) return {ok:false,msg:`That number doesn't fit ${FORMAT_NAMES[format]}. Try Code 128.`};
    const w=parseFloat(svg.getAttribute('width')),h=parseFloat(svg.getAttribute('height'));
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.removeAttribute('width');svg.removeAttribute('height');
    svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('role','img');svg.setAttribute('aria-label','Barcode '+code);
    el.appendChild(svg); return {ok:true};
  }catch(e){return {ok:false,msg:`That number doesn't fit ${FORMAT_NAMES[format]||format}. Try Code 128.`}}
}

/* ---------- storage ---------- */
function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch(e){return []}}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(vouchers));return true}catch(e){return false}}
async function persist(v){
  const clean=JSON.parse(JSON.stringify(v));
  if(mode==='db'){
    try{await col.doc(v.id).set(clean)}catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));await col.doc(v.id).set(clean);return}
      throw e;
    }
  } else {
    const i=vouchers.findIndex(x=>x.id===v.id); if(i>=0)vouchers[i]=clean; else vouchers.push(clean);
    if(!saveLocal()) throw {code:'local',message:'This browser would not save it.'};
    render();
  }
}
async function remove(id){
  if(mode==='db'){await col.doc(id).delete()}
  else{vouchers=vouchers.filter(x=>x.id!==id);saveLocal();render()}
}
function errText(e){
  if(!e) return 'Something went wrong. Try again.';
  if(e.code==='quota_exceeded') return 'Your wallet is full. Delete some old vouchers, then save again.';
  if(e.code==='invalid_argument') return 'This voucher is too big to save, usually because of the photo. Retake it closer, then save.';
  if(e.code==='revoked'||e.code==='not_granted') return 'Saving is switched off for this page. Reopen Till Ready and try again.';
  if(e.code==='local') return 'This browser blocked saving. Check it isn’t in private mode.';
  return 'Couldn’t save just now. Check your connection and try again.';
}

async function initStore(){
  const c=window.claude;
  let db=null;
  if(c&&typeof c.use==='function'){
    try{db=await c.use('db')}catch(e){db=null}
    c.use('sample').then(s=>{sample=s;refreshAskBtn()}).catch(()=>{});
  }
  if(db){
    mode='db'; col=db.collection('vouchers');
    let settled=false;
    const timer=setTimeout(()=>{if(!settled){$('storeNote').textContent='Your saved vouchers are taking a while to load. Check your signal.'}},10000);
    col.onSnapshot(snap=>{
      vouchers=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!snap.metadata.fromCache){settled=true;clearTimeout(timer);$('storeNote').textContent='Saved to your Claude account, so your vouchers are here on any device you sign in on.'}
      render(); if(openId) refreshDetail();
    },e=>{settled=true;clearTimeout(timer);$('storeNote').textContent='Lost the connection to your saved vouchers. Reopen the page to reconnect.'});
  } else {
    mode='local'; vouchers=loadLocal(); render();
    $('storeNote').textContent='Saved on this phone only. Clearing your browser data will remove them.';
  }
}

/* ---------- list ---------- */
function hue(s){let h=0;for(const ch of (s||'?'))h=(h*31+ch.charCodeAt(0))%360;return h}
function initials(s){s=(s||'?').replace(/[^A-Za-z0-9& ]/g,'').trim();const p=s.split(/\s+/);return (p.length>1?p[0][0]+p[1][0]:s.slice(0,2)).toUpperCase()||'?'}
function sortLive(a,b){const x=a.expires||'9999',y=b.expires||'9999';return x<y?-1:x>y?1:(b.createdAt||0)-(a.createdAt||0)}
function render(){
  const live=vouchers.filter(v=>!status(v).old).sort(sortLive);
  const old=vouchers.filter(v=>status(v).old).sort((a,b)=>(b.usedAt||b.expires||'')>(a.usedAt||a.expires||'')?1:-1);
  $('nLive').textContent=live.length?live.length:''; $('nOld').textContent=old.length?old.length:'';
  const soon=live.filter(v=>status(v).key==='soon').length;
  if(!vouchers.length) $('summary').textContent='No vouchers saved yet.';
  else if(!live.length) $('summary').textContent='Nothing ready to use right now.';
  else $('summary').innerHTML=`${live.length} ready to use`+(soon?` · <span class="w">${soon} running out this week</span>`:'');
  const items=tab==='live'?live:old;
  const L=$('list'); L.innerHTML='';
  if(mode==='loading'){L.innerHTML='<div class="empty"><strong>Opening your wallet…</strong>Your saved vouchers will appear here in a moment.</div>';return}
  if(!items.length){
    L.innerHTML=tab==='live'
      ? `<div class="empty"><strong>Nothing to use yet</strong>When the till prints you a voucher, tap Scan a voucher and photograph it. It lands here with a clean barcode.</div>`
      : `<div class="empty"><strong>Nothing here</strong>Vouchers you mark as used, and ones past their date, move here so they stay out of the way.</div>`;
    return;
  }
  for(const v of items){
    const st=status(v);
    const wrap=document.createElement('div');wrap.className='slip-wrap';
    const b=document.createElement('button');b.type='button';b.className='slip'+(st.old?' dim':'');
    b.innerHTML=`<div class="slip-head"><span class="badge" style="background:hsl(${hue(v.shop)} 42% 36%)">${esc(initials(v.shop))}</span><span class="shop">${esc(v.shop||'Shop not set')}</span><span class="pill ${st.cls}">${esc(st.label)}</span></div>
      <p class="offer">${esc(v.offer||'Money-off voucher')}</p>
      <div class="mini"></div>
      <div class="receipt-line">${v.expires?`<span>Valid until ${ukShort(v.expires)}</span>`:''}${v.card?`<span>Card …${esc(v.card)}</span>`:''}<span>${esc(FORMAT_NAMES[v.format]||'')}</span></div>`;
    const mini=b.querySelector('.mini');
    const r=renderCode(mini,v.code,v.format); if(!r.ok) mini.innerHTML=`<span class="receipt-line">${esc(v.code)}</span>`;
    if(v.format==='QR') mini.hidden=true;
    b.onclick=()=>openDetail(v.id);
    wrap.appendChild(b);
    if(st.key==='used'||st.key==='expired'){const s=document.createElement('span');s.className='stamp';s.textContent=st.key==='used'?'USED':'EXPIRED';wrap.appendChild(s)}
    L.appendChild(wrap);
  }
}
function setTab(t){tab=t;$('tabLive').setAttribute('aria-selected',t==='live');$('tabOld').setAttribute('aria-selected',t==='old');render()}
$('tabLive').onclick=()=>setTab('live'); $('tabOld').onclick=()=>setTab('old');

/* ---------- detail ---------- */
let openId=null, wake=null;
function openDetail(id){openId=id;$('dDelConfirm').hidden=true;$('dDel').hidden=false;refreshDetail();$('detail').hidden=false;$('detail').scrollTop=0;document.body.style.overflow='hidden';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  $('dClose').focus()}
function closeDetail(){openId=null;$('detail').hidden=true;document.body.style.overflow='';try{wake&&wake.release()}catch(e){}wake=null}
function refreshDetail(){
  const v=vouchers.find(x=>x.id===openId); if(!v){closeDetail();return}
  const st=status(v);
  $('dShop').textContent=v.shop||'Voucher';
  const r=renderCode($('dCode'),v.code,v.format);
  if(!r.ok) $('dCode').innerHTML=`<p class="prev-empty">${esc(r.msg||'No barcode number saved.')}</p>`;
  $('dDigits').textContent=v.code||''; $('dFmt').textContent=FORMAT_NAMES[v.format]||'';
  const w=$('dWarn'); w.className='banner';
  if(st.key==='expired'){w.hidden=false;w.textContent=`This expired on ${ukLong(v.expires)}. Most tills will reject it.`}
  else if(st.key==='used'){w.hidden=false;w.classList.add('info');w.textContent='You marked this as used. Most vouchers only work once.'}
  else if(st.key==='soon'){w.hidden=false;w.classList.add('warn');w.textContent=`${st.label}. Use it on your next shop.`}
  else w.hidden=true;
  $('dOffer').textContent=v.offer||'Money-off voucher';
  const f=[];
  if(v.expires)f.push(['Valid until',ukLong(v.expires)]);
  if(v.card)f.push(['Use with card','ending '+v.card]);
  if(v.notes)f.push(['Conditions',v.notes]);
  if(v.used&&v.usedAt)f.push(['Used on',ukLong(v.usedAt)]);
  $('dFacts').innerHTML=f.map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('');
  $('dFacts').hidden=!f.length;
  $('dUsed').textContent=v.used?'Move back to ready':'Mark as used';
  if(v.photo){$('dPhotoWrap').hidden=false;$('dPhoto').src=v.photo}else $('dPhotoWrap').hidden=true;
}
$('dClose').onclick=closeDetail;
$('dUsed').onclick=async()=>{const v=vouchers.find(x=>x.id===openId);if(!v)return;const nv=Object.assign({},v,{used:!v.used,usedAt:v.used?null:todayISO()});
  $('dUsed').disabled=true;try{await persist(nv);toast(nv.used?'Marked as used':'Moved back to ready');if(nv.used)closeDetail();else refreshDetail()}catch(e){toast(errText(e))}finally{$('dUsed').disabled=false}};
$('dEdit').onclick=()=>{const v=vouchers.find(x=>x.id===openId);if(v){closeDetail();openEditor(v)}};
$('dCopy').onclick=()=>{const v=vouchers.find(x=>x.id===openId);if(!v)return;
  const done=()=>toast('Number copied');
  try{navigator.clipboard.writeText(v.code).then(done).catch(selectDigits)}catch(e){selectDigits()}};
function selectDigits(){const r=document.createRange();r.selectNodeContents($('dDigits'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Number selected, tap Copy')}
$('dDel').onclick=()=>{$('dDel').hidden=true;$('dDelConfirm').hidden=false};
$('dDelNo').onclick=()=>{$('dDel').hidden=false;$('dDelConfirm').hidden=true};
$('dDelYes').onclick=async()=>{const id=openId;try{await remove(id);closeDetail();toast('Voucher deleted')}catch(e){toast('Couldn’t delete just now. Try again.')}};

/* ---------- editor ---------- */
let draft=null, photoBlob=null, photoBusy=false;
function openEditor(v,file){
  draft=v?Object.assign({},v):{id:uid(),createdAt:Date.now(),format:'CODE128',used:false};
  photoBlob=null;
  $('eTitle').textContent=v?'Edit voucher':'New voucher';
  $('fCode').value=draft.code||''; $('fFormat').value=draft.format||'CODE128'; $('fShop').value=draft.shop||'';
  $('fExp').value=draft.expires||''; $('fOffer').value=draft.offer||''; $('fCard').value=draft.card||''; $('fNotes').value=draft.notes||'';
  $('eErr').hidden=true; setStatus('','');
  if(draft.photo){$('ePhoto').src=draft.photo;$('ePhoto').hidden=false;$('retakeLbl').textContent='Retake photo'}else{$('ePhoto').hidden=true;$('retakeLbl').textContent='Take a photo'}
  refreshAskBtn(); updatePreview();
  $('editor').hidden=false;$('editor').scrollTop=0;document.body.style.overflow='hidden';
  if(file) handlePhoto(file); else if(!v) setTimeout(()=>$('fCode').focus(),50);
}
function closeEditor(){$('editor').hidden=true;document.body.style.overflow='';draft=null;photoBlob=null}
$('eClose').onclick=closeEditor;
function setStatus(cls,html){const s=$('eStatus');if(!html){s.hidden=true;return}s.hidden=false;s.className='status'+(cls?' '+cls:'');s.innerHTML=html}
function refreshAskBtn(){$('eAsk').hidden=!(sample&&photoBlob)}
function updatePreview(){
  const code=$('fCode').value.trim(), fmt=$('fFormat').value;
  const r=renderCode($('ePrev'),code,fmt);
  if(!code) $('ePrev').innerHTML='<p class="prev-empty">Your rebuilt barcode appears here.</p>';
  else if(!r.ok) $('ePrev').innerHTML=`<p class="prev-empty">${esc(r.msg)}</p>`;
  $('ePrevDigits').textContent=code; $('ePrevFmt').textContent=code&&r.ok?FORMAT_NAMES[fmt]:'';
}
$('fCode').addEventListener('input',updatePreview); $('fFormat').addEventListener('change',updatePreview);

function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{res(img)};img.onerror=()=>rej(new Error('img'));img.src=url})}
function toCanvas(img,max,rotate){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  if(rotate){c.width=h;c.height=w;ctx.translate(h,0);ctx.rotate(Math.PI/2)}else{c.width=w;c.height=h}
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return c;
}
function canvasBlob(c,q){return new Promise(r=>c.toBlob(r,'image/jpeg',q))}

const BD_MAP={code_128:'CODE128',ean_13:'EAN13',ean_8:'EAN8',upc_a:'UPC',itf:'ITF',code_39:'CODE39',qr_code:'QR'};
const ZX_MAP={CODE_128:'CODE128',EAN_13:'EAN13',EAN_8:'EAN8',UPC_A:'UPC',ITF:'ITF',CODE_39:'CODE39',QR_CODE:'QR'};
let zxingLoading=null;
function loadZXing(){if(window.ZXing)return Promise.resolve();if(zxingLoading)return zxingLoading;
  zxingLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});return zxingLoading}
async function decodeImage(img){
  if('BarcodeDetector' in window){
    try{
      const supported=await BarcodeDetector.getSupportedFormats();
      const fm=Object.keys(BD_MAP).filter(f=>supported.includes(f));
      const det=new BarcodeDetector({formats:fm});
      for(const max of [1600,1000]){const res=await det.detect(toCanvas(img,max));if(res&&res.length){const r=res.sort((a,b)=>b.rawValue.length-a.rawValue.length)[0];return {code:r.rawValue,format:BD_MAP[r.format]||'CODE128'}}}
    }catch(e){}
  }
  try{
    await loadZXing(); const Z=window.ZXing;
    const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.QR_CODE]);
    const reader=new Z.MultiFormatReader();reader.setHints(hints);
    for(const max of [1400,900,1900]){for(const rot of [false,true]){
      const c=toCanvas(img,max,rot);
      for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){
        try{const r=reader.decode(new Z.BinaryBitmap(new Bin(new Z.HTMLCanvasElementLuminanceSource(c))));
          if(r){const name=Z.BarcodeFormat[r.getBarcodeFormat()];return {code:r.getText(),format:ZX_MAP[name]||'CODE128'}}}catch(e){}
        reader.reset&&reader.reset();
      }
    }}
  }catch(e){}
  return null;
}
async function handlePhoto(file){
  if(!file||photoBusy)return; photoBusy=true;
  setStatus('','<span class="spin" aria-hidden="true"></span>Reading the barcode…');
  try{
    const img=await loadImage(file);
    const thumb=toCanvas(img,720); draft.photo=thumb.toDataURL('image/jpeg',.6);
    $('ePhoto').src=draft.photo;$('ePhoto').hidden=false;$('retakeLbl').textContent='Retake photo';
    photoBlob=await canvasBlob(toCanvas(img,1600),.82); refreshAskBtn();
    const r=await decodeImage(img);
    if(r){
      $('fCode').value=r.code;$('fFormat').value=r.format;updatePreview();
      setStatus('ok',`Barcode found: ${esc(FORMAT_NAMES[r.format])} · ${esc(r.code)}. The clean copy below is what you'll show at the till.`+(sample?' Tap Fill in details to add the offer and date.':''));
    } else {
      setStatus('warn','Couldn’t read the bars in this photo. Type the number printed under them'+(sample?', or tap Fill in details and Claude will read it.':'.'));
    }
  }catch(e){setStatus('warn','Couldn’t open that photo. Try taking it again.')}
  finally{photoBusy=false}
}
$('eAsk').onclick=async()=>{
  if(!sample||!photoBlob)return;
  const btn=$('eAsk');btn.disabled=true;btn.innerHTML='<span class="spin" aria-hidden="true"></span>Reading the voucher…';
  const prompt=`This photo shows a UK supermarket or shop money-off voucher or coupon, often on faded thermal till-receipt paper and possibly rotated. Read it and reply with JSON only, in this shape:
{"shop": string|null, "offer": string|null, "expires": "YYYY-MM-DD"|null, "card_ending": string|null, "code": string|null, "conditions": string|null}
Rules: "offer" is a short summary such as "£5 off when you spend £40" or "1000 More Points when you spend £30". Dates on UK vouchers are DD/MM/YY, so 04/11/26 is "2026-11-04". "card_ending" is only the last digits of a loyalty card if the voucher names one. "code" is the number printed under the barcode, digits exactly as printed with no spaces. "conditions" is one short line of the key restrictions. Use null for anything you cannot read.`;
  try{
    const d=await sample.json(prompt,{images:[photoBlob],modelTier:'quick'});
    let filled=[];
    if(d&&typeof d==='object'){
      if(d.shop&&!$('fShop').value){$('fShop').value=d.shop;filled.push('shop')}
      if(d.offer){$('fOffer').value=d.offer;filled.push('offer')}
      if(d.expires&&/^\d{4}-\d{2}-\d{2}$/.test(d.expires)){$('fExp').value=d.expires;filled.push('date')}
      if(d.card_ending&&!$('fCard').value){$('fCard').value=String(d.card_ending).replace(/\D/g,'').slice(-4);filled.push('card')}
      if(d.conditions&&!$('fNotes').value){$('fNotes').value=d.conditions;filled.push('conditions')}
      const decoded=$('fCode').value.trim();
      if(d.code){const c=String(d.code).replace(/\s/g,'');
        if(!decoded){$('fCode').value=c;$('fFormat').value='CODE128';updatePreview();filled.push('number');
          setStatus('warn',`Barcode rebuilt from the printed number as Code 128, the usual type for till coupons. If the checkout won't scan it, change Barcode type below.`)}
        else if(c!==decoded){setStatus('warn',`The bars read ${esc(decoded)} but the printed number looks like ${esc(c)}. Check it against the paper voucher.`)}
      }
    }
    toast(filled.length?'Filled in: '+filled.join(', '):'Couldn’t read any details from this photo');
  }catch(e){
    if(e&&e.code==='not_granted'){sample=null;refreshAskBtn();toast('Fill in details is switched off. Type them in instead.')}
    else if(e&&e.code==='rate_limited') toast('Too many requests. Wait a minute and try again.');
    else toast('Couldn’t read the voucher just now. Type the details in instead.');
  }finally{btn.disabled=false;btn.textContent='Fill in details from the photo'}
};

$('form').addEventListener('submit',async ev=>{
  ev.preventDefault(); if(!draft)return;
  const code=$('fCode').value.trim();
  const err=$('eErr');
  if(!code){err.textContent='Add the barcode number. It’s printed under the bars on the voucher.';err.hidden=false;$('fCode').focus();return}
  const r=renderCode(document.createElement('div'),code,$('fFormat').value);
  if(!r.ok){err.textContent=r.msg;err.hidden=false;$('fFormat').focus();return}
  err.hidden=true;
  const v=Object.assign({},draft,{code,format:$('fFormat').value,shop:$('fShop').value.trim(),expires:$('fExp').value||null,offer:$('fOffer').value.trim(),
    card:$('fCard').value.replace(/\D/g,'').slice(-4),notes:$('fNotes').value.trim(),updatedAt:Date.now()});
  const btns=[...document.querySelectorAll('#form [type=submit]')];btns.forEach(b=>b.disabled=true);
  try{await persist(v);closeEditor();toast('Voucher saved');setTab(status(v).old?'old':'live')}
  catch(e){err.textContent=errText(e);err.hidden=false}
  finally{btns.forEach(b=>b.disabled=false)}
});

/* ---------- entry points ---------- */
function fromInput(inp,inEditor){inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(inEditor)handlePhoto(f);else openEditor(null,f)})}
fromInput($('cam'),false); fromInput($('pick'),false); fromInput($('cam2'),true);
$('manualBtn').onclick=()=>openEditor(null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('editor').hidden)closeEditor();else if(!$('detail').hidden)closeDetail()}});

render(); $('summary').textContent='Loading your vouchers…';
initStore();
})();
</script>

</body></html>
